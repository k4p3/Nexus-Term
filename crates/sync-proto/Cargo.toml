[package]
name = "nexus-sync-proto"
version = "0.1.0"
description = "NexusTerm sync protocol: encrypted record envelope, key hierarchy and key bundle (no networking)"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
data-encoding = "2"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
